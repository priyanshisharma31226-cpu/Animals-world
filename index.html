<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Friends for Kids</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8e6cf, #dcedc1, #ffd3b6, #ffaaa5);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 2.8rem;
      color: #2c3e50;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #fff;
    }

    .subtitle {
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #555;
    }

    .animals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .animal-card {
      background: white;
      border-radius: 25px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
      border: 5px solid #fff;
    }

    .animal-card:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }

    .animal-emoji {
      font-size: 4.5rem;
      margin-bottom: 10px;
      display: block;
    }

    .animal-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: #2c3e50;
    }

    /* Detail View */
    .detail-view {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      text-align: center;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .detail-emoji {
      font-size: 7rem;
      margin-bottom: 15px;
    }

    .detail-name {
      font-size: 2.5rem;
      color: #e74c3c;
      margin-bottom: 20px;
    }

    .feature {
      background: #f8f9fa;
      border-radius: 20px;
      padding: 15px 20px;
      margin: 12px 0;
      font-size: 1.3rem;
      text-align: left;
      border-left: 8px solid #3498db;
    }

    .feature strong {
      color: #2980b9;
    }

    .sound-btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.6rem;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px 0 10px;
      box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .sound-btn:hover {
      background: #219653;
      transform: scale(1.05);
    }

    .sound-btn:active {
      transform: scale(0.98);
    }

    .back-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #c0392b;
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <h1> Animal Friends </h1>
  <p class="subtitle">Tap an animal to learn about it!</p>

  <!-- Animal Grid -->
  <div class="animals-grid" id="grid">
    <!-- Cards added by JavaScript -->
  </div>

  <!-- Detail View -->
  <div class="detail-view" id="detail">
    <div class="detail-emoji" id="detail-emoji"></div>
    <div class="detail-name" id="detail-name"></div>
    
    <div class="feature"><strong> Where it lives:</strong> <span id="habitat"></span></div>
    <div class="feature"><strong> What it eats:</strong> <span id="food"></span></div>
    <div class="feature"><strong> Fun fact:</strong> <span id="fact"></span></div>
    <div class="feature"><strong> Sound:</strong> <span id="sound"></span></div>

    <button class="sound-btn" onclick="playSound()">
      🔊 Hear the Sound!
    </button>

    <br>
    <button class="back-btn" onclick="showGrid()">← Back to Animals</button>
  </div>

  <script>
    const animals = [
      {
        name: "Lion",
        emoji: "🦁",
        habitat: "Grasslands in Africa",
        food: "Meat (zebras, antelopes)",
        fact: "Lions are the only cats that live in groups called prides!",
        sound: "ROARRR!",
        speak: "ROAR! ROAR!"
      },
      {
        name: "Elephant",
        emoji: "🐘",
        habitat: "Africa and Asia",
        food: "Leaves, grass, fruits, and bark",
        fact: "Elephants never forget and can live up to 70 years!",
        sound: "TOOT! (with their trunk)",
        speak: "Toot toot! Trumpet!"
      },
      {
        name: "Giraffe",
        emoji: "🦒",
        habitat: "African savannas",
        food: "Leaves from tall trees",
        fact: "Giraffes are the tallest animals in the world!",
        sound: "Quiet humming or snorts",
        speak: "Hmmmm snort"
      },
      {
        name: "Penguin",
        emoji: "🐧",
        habitat: "Cold places like Antarctica",
        food: "Fish and krill",
        fact: "Penguins can’t fly but they are amazing swimmers!",
        sound: "Honk! Squawk!",
        speak: "Honk honk! Squawk!"
      },
      {
        name: "Dolphin",
        emoji: "🐬",
        habitat: "Oceans all around the world",
        food: "Fish and squid",
        fact: "Dolphins are super smart and love to play!",
        sound: "Click click whistle!",
        speak: "Click click whistle!"
      },
      {
        name: "Dog",
        emoji: "🐶",
        habitat: "Homes with people",
        food: "Dog food, meat, and treats",
        fact: "Dogs are humans’ best friends and love to play fetch!",
        sound: "Woof! Woof!",
        speak: "Woof woof! Woof!"
      },
      {
        name: "Cat",
        emoji: "🐱",
        habitat: "Homes and farms",
        food: "Cat food, fish, and mice",
        fact: "Cats purr when they are happy and can jump very high!",
        sound: "Meow! Purrrr",
        speak: "Meow! Meow! Purrrr"
      },
      {
        name: "Butterfly",
        emoji: "🦋",
        habitat: "Gardens and meadows",
        food: "Nectar from flowers",
        fact: "Butterflies start as tiny caterpillars and then change!",
        sound: "Silent (they don’t make sound)",
        speak: "Flutter flutter... silent wings"
      },
      {
        name: "Frog",
        emoji: "🐸",
        habitat: "Ponds, lakes, and wet places",
        food: "Insects and bugs",
        fact: "Frogs can jump more than 20 times their body length!",
        sound: "Ribbit! Ribbit!",
        speak: "Ribbit! Ribbit! Ribbit!"
      },
      {
        name: "Bear",
        emoji: "🐻",
        habitat: "Forests and mountains",
        food: "Berries, fish, honey, and plants",
        fact: "Bears sleep all winter in a den – that’s called hibernating!",
        sound: "Grrrrowl!",
        speak: "Grrrrrowl! Grrr!"
      },
      {
        name: "Monkey",
        emoji: "🐵",
        habitat: "Trees in jungles and forests",
        food: "Fruits, leaves, and insects",
        fact: "Monkeys are very playful and good at climbing!",
        sound: "Ooh ooh aah aah!",
        speak: "Ooh ooh aah aah! Ooh ooh!"
      },
      {
        name: "Owl",
        emoji: "🦉",
        habitat: "Forests and trees",
        food: "Mice and small animals",
        fact: "Owls can turn their heads almost all the way around!",
        sound: "Hoo! Hoo!",
        speak: "Hoo hoo! Hoo hoo!"
      }
    ];

    let currentAnimal = null;

    // Create animal cards
    const grid = document.getElementById('grid');
    animals.forEach((animal, index) => {
      const card = document.createElement('div');
      card.className = 'animal-card';
      card.innerHTML = `
        <span class="animal-emoji">${animal.emoji}</span>
        <div class="animal-name">${animal.name}</div>
      `;
      card.onclick = () => showDetail(index);
      grid.appendChild(card);
    });

    function showDetail(index) {
      currentAnimal = animals[index];
      document.getElementById('detail-emoji').textContent = currentAnimal.emoji;
      document.getElementById('detail-name').textContent = currentAnimal.name;
      document.getElementById('habitat').textContent = currentAnimal.habitat;
      document.getElementById('food').textContent = currentAnimal.food;
      document.getElementById('fact').textContent = currentAnimal.fact;
      document.getElementById('sound').textContent = currentAnimal.sound;

      document.getElementById('grid').classList.add('hidden');
      document.querySelector('.subtitle').classList.add('hidden');
      document.getElementById('detail').style.display = 'block';
    }

    function showGrid() {
      // Stop any speaking
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('detail').style.display = 'none';
      document.getElementById('grid').classList.remove('hidden');
      document.querySelector('.subtitle').classList.remove('hidden');
    }

    function playSound() {
      if (!currentAnimal || !window.speechSynthesis) {
        alert("Sorry, sound is not available on this device.");
        return;
      }

      // Stop previous speech
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(currentAnimal.speak);
      utterance.rate = 0.85;       // a bit slower for kids
      utterance.pitch = 1.1;       // slightly higher and fun
      utterance.volume = 1;

      // Try to pick a nice voice if available
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => 
        v.name.includes("Google") || 
        v.name.includes("Samantha") || 
        v.name.includes("Female") ||
        v.lang.startsWith("en")
      );
      if (preferred) utterance.voice = preferred;

      window.speechSynthesis.speak(utterance);
    }

    // Load voices (needed on some browsers)
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
